; HeadTracker for Seeed XIAO ESP32C6
; Inspired by: https://github.com/headtracker/HeadTracker
; Target hardware: XIAO ESP32C6 + GY-BNO055 + SSD1306 OLED
;
; Uses pioarduino platform — a maintained fork of espressif32 that ships
; arduino-esp32 3.x with full ESP32C6 Arduino framework support.
; See: https://github.com/pioarduino/platform-espressif32

[env:xiao_esp32c6]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; Custom board JSON in ./boards/xiao_esp32c6.json — adds Arduino framework
; support to the ESP32-C6 chip and sets correct 4MB flash for XIAO
board     = xiao_esp32c6
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Upload speed
upload_speed = 460800

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_XIAO_ESP32C6=1

; Library dependencies
lib_deps =
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.2.0
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23

; Filesystem: LittleFS
board_build.filesystem = littlefs

; Partition scheme with larger filesystem
board_build.partitions = min_spiffs.csv

[env:xiao_esp32c6_debug]
extends = env:xiao_esp32c6
build_type = debug
build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_XIAO_ESP32C6=1
    -DDEBUG_HT=1
